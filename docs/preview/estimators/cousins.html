<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="only light">
  <meta name="robots" content="noindex,nofollow">
  <title>TMLE and DML tutorials · Causal Roadmap</title>
  <script>
    // Keep shared links from the former two-method page pointing to the same example.
    const old = new URL(location.href);
    let saved = old.searchParams;
    if (!['method', 'step', 'fold', 'math', 'fwl', 'patient'].some(key => saved.has(key)) && !old.hash) {
      try {
        saved = new URLSearchParams(history.state?.estimatorCousins ?? sessionStorage.getItem('causal-roadmap.estimator-cousins.v1') ?? '');
      } catch { /* The unqualified bookmark defaults to the first lesson. */ }
    }
    const method = saved.get('method');
    const wantsResiduals = method === 'plr' || saved.get('fwl') === '1' || old.hash === '#fwl';
    const dml = method === 'dml' || (method !== 'tmle' && wantsResiduals);
    const next = new URL(dml ? 'dml.html' : 'tmle.html', old);
    for (const key of ['step', 'math', ...(dml ? ['fold'] : [])]) {
      if (saved.has(key)) next.searchParams.set(key, saved.get(key));
    }
    if (old.hash && old.hash !== '#fwl') next.hash = old.hash;
    else if (dml && wantsResiduals) next.hash = 'fwl';
    if (dml && wantsResiduals && next.hash !== '#fwl') next.searchParams.set('fwl', '1');
    location.replace(next.href);
  </script>
  <link rel="stylesheet" href="tutorial.css">
</head>
<body>
<main class="frame">
  <h1>TMLE and DML</h1>
  <p><a href="tmle.html">Follow the TMLE risk update</a></p>
  <p><a href="dml.html">Follow the DML folds</a></p>
</main>
</body>
</html>
