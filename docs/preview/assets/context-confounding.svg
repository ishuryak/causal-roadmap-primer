</g>
<g font-family="'Segoe Print','Bradley Hand',cursive" font-size="27" fill="#302e2b" text-anchor="middle">
<text x="360" y="80">Pretreatment</text><text x="360" y="108">health (H)</text>
<text x="163" y="279" font-size="25">Treatment (A)</text><text x="558" y="279" font-size="25">Survival (Y)</text>
</g>
<g font-family="'Segoe UI',sans-serif" font-size="19" fill="#665d52" text-anchor="middle">
<text x="360" y="24">A proposed common cause</text><text x="360" y="335">What would changing treatment do?</text>
</g>
</svg>
