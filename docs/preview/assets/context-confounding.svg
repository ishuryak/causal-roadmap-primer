<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M251 52 Q357 35 471 52 Q482 93 468 116 Q361 127 250 114 Q242 80 251 52Z" stroke="#665d52" stroke-width="2.2"/>
<path d="M253 55 Q366 39 468 54 M251 112 Q365 123 468 112" stroke="#665d52" opacity=".3" stroke-width="1.5"/>
<path d="M288 127 Q249 173 197 222 M432 127 Q469 172 526 222" stroke="#aa6a3f" stroke-width="3.2"/>
<path d="M286 126 Q247 175 195 220 M434 127 Q472 172 528 222" stroke="#aa6a3f" opacity=".3" stroke-width="2"/>
<path d="M198 205 L194 225 L214 219 M510 219 L530 226 L524 205" stroke="#aa6a3f" stroke-width="3"/>
<path d="M73 241 Q162 229 253 241 L256 298 Q163 308 73 299 Q65 266 73 241Z M465 241 Q557 231 648 241 Q655 268 647 298 Q559 309 464 299Z" stroke="#665d52" stroke-width="2.2"/>
<path d="M79 244 Q161 233 249 243 M469 297 Q558 304 643 296" stroke="#665d52" opacity=".3" stroke-width="1.7"/>
