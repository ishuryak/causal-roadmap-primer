# Checks for the resident causal roadmap primer and its self-test
# (docs/). Separate from tests.yml so that workflow and the
# CAST site it covers are untouched. Runs the three Node suites only: the
# full-text evidence check needs copyrighted sources that are not in the
# repository, and the browser play-through needs a local Chrome, so both run
# locally (see development/2026_11_03_resident-guide-revision.md).
name: causal-roadmap

on:
  push:
    branches: [main]
    paths: ["docs/**", "tests/**", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["docs/**", "tests/**", ".github/workflows/tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  primer-and-quiz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Primer content, layout and trial-argument invariants
        run: node tests/test_causal_roadmap_primer.mjs

      - name: Simulation numerics (full sim3.json comparison, solver and SE references)
        run: node tests/test_causal_roadmap_numerics.mjs

      - name: Quiz bank rules, references and keyboard contract
        run: node tests/test_causal_roadmap_quiz.mjs

      - name: Quiz bank is current with its source
        run: |
          cp docs/quiz/bank.json /tmp/bank.saved.json
          node docs/quiz/build_bank.mjs docs/quiz/questions_source.json
          diff -q /tmp/bank.saved.json docs/quiz/bank.json
