# Checks for the resident causal roadmap primer, its optional section on
# causal diagrams, and the two self-tests (docs/). Runs the Node suites only: the
# full-text evidence check needs copyrighted sources that are not in the
# repository, and the browser play-through needs a local Chrome, so both run
# locally (see development/2026_11_03_resident-guide-revision.md).
name: causal-roadmap

on:
  push:
    branches: [main]
    paths: ["docs/**", "tests/**", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["docs/**", "tests/**", ".github/workflows/tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  primer-and-quiz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Primer content, layout and trial-argument invariants
        run: node tests/test_causal_roadmap_primer.mjs

      - name: Simulation numerics (full sim3.json comparison, solver and SE references)
        run: node tests/test_causal_roadmap_numerics.mjs

      - name: Quiz bank rules, references and keyboard contract
        run: node tests/test_causal_roadmap_quiz.mjs

      - name: Quiz bank is current with its source
        run: |
          cp docs/quiz/bank.json /tmp/bank.saved.json
          node docs/quiz/build_bank.mjs docs/quiz/questions_source.json
          diff -q /tmp/bank.saved.json docs/quiz/bank.json

      - name: Causal-diagram path logic (hand-worked paths, self-test keys)
        run: node tests/test_dag_paths.mjs

      - name: Optional causal-diagram section and its self-test
        run: node tests/test_dag_quiz.mjs

      - name: Causal-diagram bank is current with its source
        run: |
          cp docs/dag-quiz/bank.json /tmp/dag-bank.saved.json
          node docs/quiz/build_bank.mjs docs/dag-quiz/questions_source.json docs/dag-quiz
          diff -q /tmp/dag-bank.saved.json docs/dag-quiz/bank.json

      - name: Regressions from the 2026-11-03 external review (U01-U11, H01-H04)
        run: node tests/test_review_2026_11_03.mjs

      - name: References are in first-citation order (renumbering tool, read-only)
        run: python3 tools/renumber_refs.py --check
